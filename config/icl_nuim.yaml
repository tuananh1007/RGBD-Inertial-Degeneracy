# ICL-NUIM living room (synthetic RGB-D at 30 Hz, perfect depth at factor 5000, IMU synthesized from the reference
# trajectory by imu_synthesis.py with BMI055-like white noise and no bias drift) in the layout of the other base
# configs (openloris_tf.yaml): E12 consistency simulation, 2026-10-26.  The camera is the IMU (identity extrinsics).
common:
  depth_topic:      "/camera/depth/image_rect_raw"
  depth_info_topic: "/camera/depth/camera_info"
  imu_topic:        "/camera/imu"
  img_topic:        "/camera/color/image_raw"
  img_en:  1
  depth_en: true
  lio_en: true
extrin_calib:
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0,
                0, 1, 0,
                0, 0, 1]
  Rcl: [1, 0, 0,
        0, 1, 0,
        0, 0, 1]
  Pcl: [0.0, 0.0, 0.0]
time_offset:
  imu_time_offset:   0.0
  img_time_offset:   0.0
  depth_time_offset: 0.0
  exposure_time_init: 0.0
depth:
  min_depth:        0.10     # rendered depth: no minimum range
  max_depth:        6.00     # the rooms are 5-6 m across
  depth_scale:      0.0002   # factor 5000
  point_filter_num: 4
  noise_frac:       0.005    # the depth is exact; these model values are conservative
  lateral_noise:    0.003
  flying_pixel_en:     false
  flying_pixel_thresh: 0.10
  depth_bins_en:    true
  num_depth_bins:   10
  max_pts_per_bin:  2500
  info_select_en:   true
  target_points:    20000
  rebalance_alpha:  0.5
preprocess:
  filter_size_surf: 0.08
lio:
  max_iterations:  5
  dept_err:        0.03
  beam_err:        0.01
  min_eigen_value: 0.005
  voxel_size:      0.25
  max_layer:       2
  max_points_num:  50
  layer_init_num:  [5, 5, 5, 5, 5]
  deg_threshold:         0.07
  oc_ekf_en:          true
  oc_lambda_thresh:   0.05
  oc_adaptive_thresh_en: true
  oc_lambda_lo:       0.01
  oc_lambda_hi:       0.10
  oc_adapt_kappa_knee: 20.0
  oc_cov_inflate:     10.0
  deg_isotropy_thresh:   0.10
  skip_vio_sigma_thresh: 0.30
local_map:
  map_sliding_en: true
  half_map_size:  30
  sliding_thresh: 5
  lv_max_pts:        50000
  lv_voxel_size:     2.0
  lv_update_interval: 30
vio:
  max_iterations:         5
  outlier_threshold:      1000
  img_point_cov:          100
  patch_size:             8
  patch_pyrimid_level:    4
  normal_en:              true
  raycast_en:             false
  inverse_composition_en: false
  exposure_estimate_en:   false
  inv_expo_cov:           0.1
imu:
  imu_en:       true        # synthesized at 200 Hz
  imu_int_frame: 30
  acc_cov:       0.1        # legacy FAST-LIVO2-style values (unused with the continuous-time model)
  gyr_cov:       0.1
  b_acc_cov:     0.0001
  b_gyr_cov:     0.0001
  gyr_noise_density: 0.004      # imu_synthesis.GYR_NOISE_DENSITY (rad/s/sqrt(Hz))
  acc_noise_density: 0.012      # imu_synthesis.ACC_NOISE_DENSITY (m/s^2/sqrt(Hz))
  gyr_random_walk:   0.00001    # the synthesis adds no bias drift; small nonzero values keep the bias states alive
  acc_random_walk:   0.0001
uav:
  imu_rate_odom:   false
  gravity_align_en: true
publish:
  dense_map_en:       false
  pub_effect_point_en: false
  pub_scan_num:       1
  blind_rgb_points:   0.0
evo:
  seq_name:      "icl_nuim"
  pose_output_en: true
pcd_save:
  pcd_save_en:      false
  type:             0
  colmap_output_en: false
  filter_size_pcd:  0.10
  interval:         -1
image_save:
  img_save_en: false
  interval:    1
cam0:
  camera_model: pinhole
  distortion_model: radtan
  distortion_coeffs: [0.0, 0.0, 0.0, 0.0]
  intrinsics: [481.20, 480.00, 319.50, 239.50]
  resolution: [640, 480]
debug:
  plot_time: -10
  frame_cnt:  6
  linearity_window: 20
