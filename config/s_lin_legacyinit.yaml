# Strided-fill base (2026-10-16 rerun): lin_legacyinit.yaml with depth/itps_fill = strided.
# Legacy-IMU split: staged propagation and continuous-time noise, but FAST-LIVO2-style initialization
# (first-samples gravity, bias = mean gyro, accel rescale, no acceptance test).
imu:
  init_mode: staged
  bias_inflate_after: 1000000.0
  legacy_init: true
lio:
  dtf_mode: plain
depth:
  info_select_en: true
  itps_min_candidates: 1000
  itps_fill: strided
local_map:
  lv_update_interval: 1000000000
debug:
  linearity_window: 1000000000
common:
  img_en: 1
evo:
  pose_output_en: true
