# Base configuration: P1.yaml plus ITPS information-guided point selection,
# with a depth-bin fallback when a frame has < 1000 ITPS candidates (sparse,
# LiDAR-rendered depth; real D455/D435i frames have > 44k).
imu:
  init_mode: staged
  bias_inflate_after: 1000000.0
lio:
  dtf_mode: plain
depth:
  info_select_en: true
  itps_min_candidates: 1000
local_map:
  lv_update_interval: 1000000000
debug:
  linearity_window: 1000000000
common:
  img_en: 1
evo:
  pose_output_en: true
