# E10 (2026-10-22): Ours with the covariance output (= e5_ours)
# and the variances of both the depth residuals (lio/meas_var_scale) and the photometric residuals (vio/img_point_cov,
# 100 in every dataset config) multiplied by 100.
imu:
  init_mode: staged
  bias_inflate_after: 1000000.0
lio:
  dtf_mode: plain
  meas_var_scale: 100.0
depth:
  info_select_en: true
  itps_min_candidates: 1000
  itps_fill: strided
local_map:
  lv_update_interval: 1000000000
debug:
  linearity_window: 1000000000
common:
  img_en: 1
evo:
  cov_output_en: true
  pose_output_en: true
vio:
  img_point_cov: 10000.0
